templates:
  predictive_maintenance:
    label: "Predictive Maintenance / Factory"
    connectors: ["demo_simulator", "pymodbus", "opcua", "api"]
    filter_fields:
      - {key: site, label: "Plant / Site", hint: "e.g. Munich Plant"}
      - {key: line, label: "Production Line", hint: "e.g. Assembly Line 3"}
      - {key: machine, label: "Machine / Asset", hint: "e.g. CNC-01, Robot Arm"}
      - {key: product, label: "Product / SKU", hint: "e.g. Model X chassis"}
      - {key: region, label: "Region", hint: "e.g. EU-North"}
    kpi_focus: ["failure_rate", "mean_rul", "mean_temperature", "uptime_pct"]
    alert_rules:
      - {metric: failure_rate, threshold: 0.1, severity: high}
      - {metric: min_rul, threshold: 50, severity: critical}
    insight_templates:
      failure: "Machine/asset risk: failure likelihood is elevated — schedule maintenance."
      forecast_up: "Output/RUL trend is improving."
      forecast_down: "Asset health is declining — expect downtime risk."
    recommended_charts: ["line", "scatter", "bar"]

  sales_forecasting:
    label: "Sales / Retail / Brand (e.g. Gucci-style commerce)"
    connectors: ["demo_simulator", "api", "azure"]
    filter_fields:
      - {key: region, label: "Market / Region", hint: "e.g. North America"}
      - {key: product, label: "Product / Category", hint: "e.g. Handbags, Electronics"}
      - {key: channel, label: "Sales Channel", hint: "e.g. Online, Store, Wholesale"}
      - {key: store, label: "Store / Brand Unit", hint: "e.g. Flagship NYC"}
      - {key: campaign, label: "Campaign", hint: "e.g. Summer Launch"}
    kpi_focus: ["total_revenue", "avg_units", "growth_pct"]
    alert_rules:
      - {metric: revenue_drop, threshold: 0.3, severity: warning}
    insight_templates:
      failure: "Conversion/churn risk is elevated."
      forecast_up: "Sales are projected to increase based on recent trend."
      forecast_down: "Revenue is projected to decline — review pricing/campaigns."
    recommended_charts: ["line", "bar", "pie"]

  healthcare:
    label: "Healthcare / Hospital"
    connectors: ["demo_simulator", "api", "azure"]
    filter_fields:
      - {key: hospital, label: "Hospital / Facility", hint: "e.g. City General"}
      - {key: department, label: "Department", hint: "e.g. ER, Cardiology"}
      - {key: ward, label: "Ward / Unit", hint: "e.g. ICU-2"}
      - {key: doctor, label: "Physician / Care Team", hint: "e.g. Dr. Rao"}
      - {key: diagnosis, label: "Diagnosis Group", hint: "e.g. Cardiac"}
    kpi_focus: ["patient_count", "avg_wait_time", "readmission_rate"]
    alert_rules:
      - {metric: readmission_rate, threshold: 0.15, severity: high}
    insight_templates:
      failure: "Readmission / risk-of-complication is elevated for this cohort."
      forecast_up: "Patient volume is projected to rise — staff capacity may be needed."
      forecast_down: "Admissions are projected to fall for this window."
    recommended_charts: ["bar", "line", "histogram"]

  supply_chain:
    label: "Warehouse / Supply Chain / Logistics"
    connectors: ["demo_simulator", "api", "opcua", "azure"]
    filter_fields:
      - {key: warehouse, label: "Warehouse / DC", hint: "e.g. DC-West"}
      - {key: aisle, label: "Aisle / Zone", hint: "e.g. Zone B"}
      - {key: sku, label: "SKU / Item", hint: "e.g. SKU-4421"}
      - {key: carrier, label: "Carrier", hint: "e.g. DHL"}
      - {key: region, label: "Region", hint: "e.g. APAC"}
    kpi_focus: ["delivery_time", "inventory_turnover", "defect_rate"]
    alert_rules:
      - {metric: defect_rate, threshold: 0.05, severity: warning}
    insight_templates:
      failure: "Stockout or defect risk is elevated for this SKU/zone."
      forecast_up: "Throughput is projected to increase."
      forecast_down: "Inventory / delivery performance is projected to worsen."
    recommended_charts: ["bar", "scatter", "line"]

  erp_cloud:
    label: "ERP / Cloud SaaS (Azure / Google-style systems)"
    connectors: ["demo_simulator", "api", "azure"]
    filter_fields:
      - {key: tenant, label: "Tenant / Org", hint: "e.g. Contoso"}
      - {key: app, label: "Application / Module", hint: "e.g. Finance, CRM"}
      - {key: environment, label: "Environment", hint: "e.g. prod, staging"}
      - {key: region, label: "Cloud Region", hint: "e.g. eastus"}
      - {key: resource, label: "Resource / Service", hint: "e.g. billing-api"}
    kpi_focus: ["error_rate", "latency_p95", "active_users"]
    alert_rules:
      - {metric: error_rate, threshold: 0.05, severity: high}
    insight_templates:
      failure: "Service reliability risk is elevated (errors / latency)."
      forecast_up: "Usage / revenue events are projected to grow."
      forecast_down: "Usage is projected to decline — check release or outage impact."
    recommended_charts: ["line", "bar", "area"]

  generic:
    label: "Generic Analytics"
    connectors: ["demo_simulator", "api", "azure"]
    filter_fields:
      - {key: region, label: "Region / Segment", hint: "optional"}
      - {key: product, label: "Product / Category", hint: "optional"}
      - {key: source, label: "Data Source", hint: "e.g. export, API"}
    kpi_focus: ["row_count", "col_count", "missing_pct"]
    alert_rules: []
    insight_templates:
      failure: "Risk signal detected in the selected slice."
      forecast_up: "The target metric is projected to increase."
      forecast_down: "The target metric is projected to decline."
    recommended_charts: ["bar", "line", "scatter"]
