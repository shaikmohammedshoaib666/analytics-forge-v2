domains:
  predictive_maintenance:
    name: Predictive Maintenance
    keywords:
      - failure
      - rul
      - vibration
      - temperature
      - sensor
      - machine
      - bearing
      - downtime
      - maintenance
      - pressure
      - asset
    kpi_hints: [failure_rate, avg_temperature, avg_vibration, row_count]
    recommended_models: [RandomForestRegressor, GradientBoostingRegressor, IsolationForest]
    users: [Reliability engineer, Data analyst, Plant manager, I4.0 engineer]
    what_we_can_do:
      - Predict failure risk and remaining useful life
      - Detect sensor anomalies
      - Rank assets by health risk
      - Report R2 RMSE MAE for regression models

  sales_forecasting:
    name: Sales Forecasting
    keywords:
      - sales
      - revenue
      - order
      - units
      - customer
      - region
      - sku
      - price
      - quantity
      - channel
    kpi_hints: [total_revenue, avg_order_value, units_sold, row_count]
    recommended_models: [Prophet, RandomForestRegressor, GradientBoostingRegressor]
    users: [Sales analyst, Revenue manager, Student, Executive]
    what_we_can_do:
      - Forecast revenue and demand
      - Compare regions and categories
      - Answer questions like sales today
      - Build executive sales dashboards

  hospital_medical:
    name: Hospital / Medical Analytics
    keywords:
      - patient
      - diagnosis
      - hospital
      - admission
      - bed
      - length_of_stay
      - treatment
      - clinic
      - icu
      - readmission
    kpi_hints: [patient_count, avg_los, readmission_rate, row_count]
    recommended_models: [LogisticRegression, RandomForestClassifier, GradientBoostingClassifier]
    users: [Clinical analyst, Hospital manager, Data analyst]
    what_we_can_do:
      - Track admissions and length of stay
      - Segment patients and risk flags
      - Build clinical operational dashboards

  warehouse_efficiency:
    name: Warehouse Layout and Efficiency
    keywords:
      - warehouse
      - aisle
      - sku
      - pick
      - inventory
      - throughput
      - location
      - slot
      - dock
      - utilization
    kpi_hints: [throughput, utilization, pick_rate, row_count]
    recommended_models: [KMeans, RandomForestRegressor, PuLP]
    users: [Warehouse manager, I4.0 engineer, Ops analyst]
    what_we_can_do:
      - Measure utilization and bottlenecks
      - Segment locations and SKUs
      - Optimize layout when solver available

  customer_segmentation:
    name: Customer Segmentation
    keywords:
      - customer
      - segment
      - cohort
      - ltv
      - churn
      - recency
      - frequency
      - monetary
      - persona
    kpi_hints: [customer_count, avg_ltv, segment_count, row_count]
    recommended_models: [KMeans, DBSCAN, PCA, RandomForestClassifier]
    users: [Marketing analyst, CRM manager, Student]
    what_we_can_do:
      - Cluster customers
      - Profile high-value segments
      - Support campaign targeting

  marketing_campaign:
    name: Marketing / Campaign Analytics
    keywords:
      - campaign
      - click
      - impression
      - conversion
      - ctr
      - cpc
      - ad
      - funnel
      - engagement
    kpi_hints: [ctr, conversions, spend, row_count]
    recommended_models: [LogisticRegression, GradientBoostingClassifier, RandomForestClassifier]
    users: [Marketing analyst, Growth manager]
    what_we_can_do:
      - Measure campaign performance
      - Predict conversion
      - Optimize channel mix

  executive_dashboard:
    name: Executive Business Dashboard
    keywords:
      - kpi
      - margin
      - profit
      - ebitda
      - headcount
      - budget
      - actual
      - forecast
      - variance
    kpi_hints: [total_revenue, margin, variance, row_count]
    recommended_models: [LinearRegression, Prophet, RandomForestRegressor]
    users: [Executive, Manager, BI analyst]
    what_we_can_do:
      - Build PowerBI-style KPI boards
      - Track variance to plan
      - Narrative briefings for leadership

  generic:
    name: Generic Tabular Analytics
    keywords: []
    kpi_hints: [row_count, numeric_mean, missing_rate]
    recommended_models: [RandomForestRegressor, KMeans, IsolationForest]
    users: [Data analyst, Student, Manager]
    what_we_can_do:
      - Profile and clean any tabular dataset
      - Explore charts and run baseline ML
      - Generate a learning guide pack
