services:
  analytics-forge:
    build: .
    image: analytics-forge:latest
    container_name: analytics-forge
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      # Keep users, projects, and clean CSVs across redeploys
      - ./data:/app/data
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
