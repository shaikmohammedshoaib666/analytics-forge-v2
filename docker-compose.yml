services:
  analytics-forge:
    build:
      context: .
      args:
        # Full stack on VM; HF Spaces Dockerfile defaults to requirements-cloud.txt
        REQUIREMENTS_FILE: requirements.txt
    image: analytics-forge:latest
    container_name: analytics-forge
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
