# Render Blueprint — free public host for Analytics Forge v2
# Deploy: https://dashboard.render.com/blueprints → New Blueprint Instance
# Repo: shaikmohammedshoaib666/analytics-forge-v2
# Branch MUST be: cursor/forge-v2-foundation-f3f9  (main is old v1-style layout)
# LIVE Modbus to private plant IPs will NOT work from Render — use MANUAL or buffer_only.

services:
  - type: web
    name: analytics-forge-v2
    runtime: python
    plan: free
    region: oregon
    branch: cursor/forge-v2-foundation-f3f9
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
